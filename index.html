<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Last of Us — Part II (Fan Tribute)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body {
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    color: #e7e3d8; cursor: crosshair; user-select: none;
  }
  #game { display: block; position: absolute; inset: 0; background: #05070a; }

  /* ---------- HUD ---------- */
  #hud {
    position: absolute; left: 18px; bottom: 18px; z-index: 5;
    display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    text-shadow: 0 1px 3px #000;
  }
  .hpbar {
    width: 220px; height: 14px; background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.25); border-radius: 7px; overflow: hidden;
  }
  #hpFill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #b5302a, #e25b3a);
    transition: width 0.18s ease;
  }
  .stats { display: flex; gap: 18px; font-size: 15px; letter-spacing: 0.4px; }
  .stats .ico { opacity: 0.85; }
  .stats b { color: #f4e9c8; }

  #topbar {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 5; text-align: center; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  #objective {
    font-size: 14px; color: #d8d2c2; background: rgba(0,0,0,0.4);
    padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    text-shadow: 0 1px 2px #000; max-width: 80vw;
  }
  .alert {
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    padding: 3px 14px; border-radius: 14px; transition: all 0.2s;
  }
  .alert.hidden { color: #8fae8f; }
  .alert.hunting { color: #1a1a1a; background: #e3a23c; }
  .alert.spotted { color: #fff; background: #c0241c; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

  #toast {
    position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
    z-index: 6; background: rgba(0,0,0,0.6); color: #f4e9c8;
    padding: 8px 18px; border-radius: 22px; font-size: 14px;
    border: 1px solid rgba(255,255,255,0.12);
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
  }
  #toast.show { opacity: 1; }

  /* ---------- Overlay ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(15,18,24,0.86), rgba(3,4,7,0.97));
    backdrop-filter: blur(2px);
  }
  #overlay.show { display: flex; }
  .panel {
    text-align: center; max-width: 560px; padding: 40px 38px;
    background: rgba(10,12,16,0.6); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }
  #overlayTitle {
    font-size: 30px; font-weight: 800; letter-spacing: 3px;
    color: #f1ead4; margin-bottom: 14px; line-height: 1.2;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
  }
  #overlayText { font-size: 15px; line-height: 1.6; color: #c8c3b5; margin-bottom: 22px; }
  #overlayText i { color: #8aa0c0; }
  .ctrls {
    display: flex; flex-direction: column; gap: 6px; margin-top: 16px;
    text-align: left; font-size: 13.5px; color: #b9b4a6;
    background: rgba(0,0,0,0.3); padding: 14px 18px; border-radius: 10px;
  }
  .ctrls b { color: #e9dfbf; }
  #overlayBtn {
    margin-top: 6px; cursor: pointer; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; color: #10130f; background: #cdbd84;
    border: none; padding: 12px 40px; border-radius: 8px;
    transition: transform 0.1s, background 0.2s;
  }
  #overlayBtn:hover { background: #e3d499; transform: translateY(-1px); }
  .credit {
    position: absolute; bottom: 10px; right: 14px; z-index: 5;
    font-size: 11px; color: rgba(255,255,255,0.28); pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="topbar">
    <div id="objective">…</div>
    <div id="alert" class="alert hidden">HIDDEN</div>
  </div>

  <div id="hud">
    <div class="stats">
      <span class="ico">🔫 <b id="ammo">0</b></span>
      <span class="ico">🍾 <b id="bottles">0</b></span>
      <span class="ico">➕ <b id="kits">0</b> <small>(R)</small></span>
    </div>
    <div class="hpbar"><div id="hpFill"></div></div>
  </div>

  <div id="toast"></div>

  <div id="overlay">
    <div class="panel">
      <div id="overlayTitle"></div>
      <div id="overlayText"></div>
      <button id="overlayBtn">Start</button>
    </div>
  </div>

  <div class="credit">Unofficial fan tribute · original code &amp; art</div>

  <script src="game.js"></script>
</body>
</html>
